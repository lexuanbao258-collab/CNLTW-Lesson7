<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main class="container">
    <div th:replace="~{fragments :: alerts}"></div>
    <div class="page-heading">
        <div><p class="intro" th:text="${course.category.name}"></p>
            <h1 th:text="${course.name}"></h1></div>
        <div class="actions"><a class="button" th:href="@{/courses/{id}/edit(id=${course.id})}">Chỉnh sửa</a><a
                class="button secondary" th:href="@{/courses}">Về danh sách</a></div>
    </div>
    <section class="detail-grid">
        <div class="panel">
            <dl class="facts">
                <div>
                    <dt>Học phí</dt>
                    <dd class="price" th:text="${course.formattedTuitionFee + ' ₫'}"></dd>
                </div>
                <div>
                    <dt>Thời lượng</dt>
                    <dd th:text="${course.duration + ' giờ · ' + course.durationLabel}"></dd>
                </div>
                <div>
                    <dt>Trạng thái</dt>
                    <dd><span th:class="${course.isActive ? 'badge active' : 'badge inactive'}"
                              th:text="${course.isActive ? 'Đang tuyển sinh' : 'Ngừng tuyển sinh'}"></span></dd>
                </div>
            </dl>
            <h2>Mô tả khóa học</h2>
            <p class="description"
               th:text="${#strings.isEmpty(course.description) ? 'Chưa có mô tả.' : course.description}"></p></div>
        <div class="panel"><h2>Thêm hình ảnh</h2>
            <p class="muted">Dùng URL HTTP/HTTPS. Ảnh đầu tiên tự trở thành ảnh đại diện.</p>
            <form method="post" th:action="@{/courses/{id}/images(id=${course.id})}" th:object="${imageForm}"><label
                    for="imageUrl">URL hình ảnh</label><input id="imageUrl" type="url" th:field="*{imageUrl}"
                                                              placeholder="https://..." maxlength="2000" required>
                <p class="field-error" th:errors="*{imageUrl}"></p>
                <button type="submit">Thêm ảnh</button>
            </form>
        </div>
    </section>
    <section class="images-section"><h2>Hình ảnh khóa học</h2>
        <p class="empty panel" th:if="${#lists.isEmpty(course.images)}">Khóa học chưa có ảnh. Thêm URL ảnh bằng form
            phía trên.</p>
        <div class="gallery">
            <article class="image-card" th:each="image : ${course.images}"><img th:src="${image.imageUrl}"
                                                                                th:alt="${'Hình ảnh của ' + course.name}">
                <div class="image-meta"><span class="badge active" th:if="${image.isThumbnail}">Ảnh đại diện</span>
                    <form th:unless="${image.isThumbnail}" method="post"
                          th:action="@{/courses/{id}/images/{imageId}/thumbnail(id=${course.id},imageId=${image.id})}">
                        <button class="small" type="submit">Đặt làm ảnh đại diện</button>
                    </form>
                    <a th:href="${image.imageUrl}" target="_blank" rel="noopener noreferrer">Mở ảnh</a></div>
            </article>
        </div>
    </section>
</main>
<footer>Course Management · Thực hành Công nghệ lập trình Web</footer>
<script th:src="@{/js/images.js}" defer></script>
</body>
</html>
