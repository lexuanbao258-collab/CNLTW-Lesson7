<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main class="container">
    <div th:replace="~{fragments :: alerts}"></div>
    <section class="panel narrow error-page"><h1>Không thể thực hiện yêu cầu</h1>
        <p role="alert"
           th:text="${message ?: 'Yêu cầu chưa thực hiện được. Vui lòng kiểm tra địa chỉ hoặc thử lại sau.'}"></p>
        <div class="actions"><a class="button" th:href="@{/courses}">Về danh sách khóa học</a><a
                class="button secondary" th:href="@{/}">Trang chủ</a></div>
    </section>
</main>
<footer>Course Management · Thực hành Công nghệ lập trình Web</footer>
<script th:src="@{/js/images.js}" defer></script>
</body>
</html>
