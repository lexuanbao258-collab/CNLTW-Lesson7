<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head}"></head><body><nav th:replace="~{fragments :: nav}"></nav><main class="container"><div th:replace="~{fragments :: alerts}"></div><div class="page-heading"><div><h1>Loại khóa học</h1><p>Tổ chức khóa học theo nhóm chuyên môn.</p></div><a class="button" th:href="@{/categories/new}">Thêm loại khóa học</a></div>
<div class="table-wrap"><table><caption class="sr-only">Danh sách loại khóa học</caption><thead><tr><th>ID</th><th>Tên loại khóa học</th><th>Mô tả</th><th>Thao tác</th></tr></thead><tbody><tr th:each="cat : ${categories}"><td th:text="${cat.id}"></td><td><a th:href="@{/courses(categoryId=${cat.id})}" th:text="${cat.name}"></a></td><td th:text="${cat.description}"></td><td><div class="row-actions"><a th:href="@{/categories/{id}/edit(id=${cat.id})}">Sửa</a><form method="post" th:action="@{/categories/{id}/delete(id=${cat.id})}" data-confirm="Xóa loại khóa học này?"><button class="text-button danger" type="submit">Xóa</button></form></div></td></tr><tr th:if="${#lists.isEmpty(categories)}"><td colspan="4" class="empty">Chưa có loại khóa học. Hãy thêm loại khóa học đầu tiên.</td></tr></tbody></table></div></main><footer>Course Management · Thực hành Công nghệ lập trình Web</footer><script th:src="@{/js/images.js}" defer></script></body></html>
